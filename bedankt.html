<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bedankt — CareAIgent</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;900&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #002841;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  .icon { font-size: 64px; margin-bottom: 24px; }
  h1 {
    font-family: 'Raleway', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: -1px;
    margin-bottom: 16px;
    color: #fff;
  }
  h1 span { color: #25C7D9; }
  p {
    font-size: 17px;
    font-weight: 300;
    color: rgba(255,255,255,0.65);
    line-height: 1.7;
    max-width: 480px;
    margin-bottom: 40px;
  }
  a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #219ABD;
    color: #fff;
    font-family: 'Raleway', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 8px;
    text-decoration: none;
    transition: background 0.2s;
  }
  a:hover { background: #25C7D9; }
</style>
</head>
<body>
  <div class="icon">✅</div>
  <h1>Bericht <span>ontvangen!</span></h1>
  <p>Bedankt voor uw bericht. Het CareAIgent-team neemt zo snel mogelijk contact met u op.</p>
  <a href="/">← Terug naar de website</a>
</body>
</html>
